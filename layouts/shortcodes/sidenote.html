<aside class="sidenote">
  {{ if .Get "image" }}
    <img src="{{ .Get "image" | relURL }}" alt="{{ .Get "caption" | default "sidenote image" }}">
  {{ end }}
  {{ if .Get "caption" }}
    <p class="sidenote-caption">{{ .Get "caption" }}</p>
  {{ end }}
  {{ if .Inner }}
    <div class="sidenote-content">{{ .Inner | markdownify }}</div>
  {{ end }}
</aside>
