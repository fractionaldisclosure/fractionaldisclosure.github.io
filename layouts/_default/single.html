<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ .Title }} &mdash; Your Blog</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/bitmaks/cm-web-fonts@latest/fonts.css">
  <style>
    body{font-family:'Computer Modern Serif',serif}
    .post-content{display:flex}
    .post-text{width:50%;border-right:1px solid #ccc;padding-right:1em}
    .post-attachments{width:33%;padding-left:1em}
    .post-attachments img{max-width:100%;display:block}
    .attachment+.attachment{margin-top:1em}
    pre code{font-family:'Computer Modern Typewriter',monospace}
  </style>
</head>
<body>

<p>
  <a href="/">Archive</a> |
  <a href="/about/">About</a>
</p>

<hr>

<h1>{{ .Title }}</h1>
<p><em>{{ .Date.Format "02/01/06" }}</em> &mdash; {{ if .Params.authors }}{{ delimit .Params.authors ", " }}{{ end }}</p>

<div class="post-content">
  <div class="post-text">
    {{ .Content }}
  </div>
  <div class="post-attachments">
    {{ range .Params.attachments }}
    <div class="attachment"{{ if .margin }} style="margin-top:{{ .margin }}"{{ end }}>
      {{ if .image }}
      <img src="{{ .image | relURL }}" alt="{{ .alt | default "attachment" }}">
      {{ end }}
      {{ if .code }}
      <pre><code>{{ .code }}</code></pre>
      {{ end }}
    </div>
    {{ end }}
  </div>
</div>

<hr>

<p>
  <a href="/">&larr; All posts</a>
</p>
</body>
</html>
